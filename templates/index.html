<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Infrastructure Dashboard</title>
    <!-- Using Google Fonts for a sleek, modern tech look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- Using FontAwesome for industry-standard icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #10b981;
            --border-color: #334155;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.05), transparent 25%);
        }

        .dashboard-container {
            width: 100%;
            max-width: 900px;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0 0 0.5rem 0;
            background: linear-gradient(to right, var(--accent-blue), #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin: 0;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .metric-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s, box-shadow 0.2s;
            animation: fadeInUp 0.8s ease-out backwards;
        }

        .metric-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            border-color: var(--accent-blue);
        }

        .metric-card:nth-child(1) { animation-delay: 0.1s; }
        .metric-card:nth-child(2) { animation-delay: 0.2s; }
        .metric-card:nth-child(3) { animation-delay: 0.3s; }
        .metric-card:nth-child(4) { animation-delay: 0.4s; }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }

        .card-icon {
            font-size: 1.2rem;
            color: var(--accent-blue);
        }

        .card-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            word-break: break-all;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0.75rem;
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .pulse {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulsing 2s infinite;
        }

        .architecture-banner {
            background: linear-gradient(145deg, var(--card-bg), #0f172a);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            animation: fadeInUp 0.8s ease-out backwards;
            animation-delay: 0.5s;
        }

        .architecture-path {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 1rem;
            color: var(--accent-blue);
            font-weight: 600;
        }

        .architecture-path i {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        @keyframes pulsing {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header">
            <h1>Muneeb's Cloud Infrastructure</h1>
            <p>Production Environment Monitoring Dashboard</p>
        </div>

        <div class="metrics-grid">
            <!-- Metric 1: System Status -->
            <div class="metric-card">
                <div class="card-header">
                    <span>System Status</span>
                    <i class="fa-solid fa-heart-pulse card-icon"></i>
                </div>
                <div class="status-indicator">
                    <div class="pulse"></div>
                    Healthy & Active
                </div>
            </div>

            <!-- Metric 2: Host Node -->
            <div class="metric-card">
                <div class="card-header">
                    <span>Active Container Node</span>
                    <i class="fa-solid fa-server card-icon"></i>
                </div>
                <div class="card-value">{{ hostname }}</div>
            </div>

            <!-- Metric 3: UTC Time -->
            <div class="metric-card">
                <div class="card-header">
                    <span>Server Timestamp (UTC)</span>
                    <i class="fa-regular fa-clock card-icon"></i>
                </div>
                <div class="card-value">{{ time }}</div>
            </div>

            <!-- Metric 4: CI/CD -->
            <div class="metric-card">
                <div class="card-header">
                    <span>Deployment Pipeline</span>
                    <i class="fa-solid fa-code-merge card-icon"></i>
                </div>
                <div class="card-value" style="color: var(--accent-green); font-size: 1rem;">
                    <i class="fa-brands fa-jenkins" style="margin-right: 5px;"></i> Jenkins Automated
                </div>
            </div>
        </div>

        <div class="architecture-banner">
            <div class="card-header" style="justify-content: center; margin-bottom: 0.5rem;">
                <i class="fa-solid fa-network-wired" style="margin-right: 8px;"></i> Architecture Stack
            </div>
            <div class="architecture-path">
                <span>GitHub</span>
                <i class="fa-solid fa-chevron-right"></i>
                <span>Jenkins CI</span>
                <i class="fa-solid fa-chevron-right"></i>
                <span>Amazon ECR</span>
                <i class="fa-solid fa-chevron-right"></i>
                <span>AWS ECS Fargate</span>
                <i class="fa-solid fa-chevron-right"></i>
                <span>ALB</span>
            </div>
        </div>
    </div>

</body>
</html>
