<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My DevOps Project</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(10px);
            text-align: center;
            max-width: 500px;
        }
        h1 { margin-top: 0; font-size: 2.5rem; }
        p { font-size: 1.2rem; line-height: 1.5; }
        .data-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 DevOps App V1</h1>
        <p>Welcome to the production environment! This application will travel from a raw EC2 server all the way to ECS Fargate.</p>
        <div class="data-box">
            Served by Host: <strong>{{ hostname }}</strong><br>
            Time: <strong>{{ time }}</strong>
        </div>
    </div>
</body>
</html>
